<body>
	<section>
	
		<div class="container-fluid bg-primary p-4 mt-5 ">
			<div class="row">
				<div class="col-md-8 offset-md-2">
					<form id="searchForm" action="/products" method="get">
						<div class="input-group">
							<input type="text" class="form-control" name="ch" id="searchInput">

							<button type="button" class="btn btn-light text-dark ms-1" onclick="startVoiceSearch()">
								? Voice
							</button>

							<button class="btn btn-light text-dark ms-3 col-md-2">
								<i class="fa-solid fa-magnifying-glass"></i> Search
							</button>
						</div>
					</form>
				</div>
			</div>

		</div> <script>
		function startVoiceSearch() {
			if (!('webkitSpeechRecognition' in window)) {
				alert("Voice search is not supported in your browser.");
				return;
			}

			const recognition = new webkitSpeechRecognition();
			recognition.lang = "en-US";
			recognition.continuous = false;
			recognition.interimResults = false;

			recognition.start();
			recognition.onresult = function(event) {
				let result = event.results[0][0].transcript;

				// Clean unwanted punctuation
				result = result.replace(/[.,!?]/g, "").trim();

				document.getElementById("searchInput").value = result;

				setTimeout(() => {
					document.getElementById("searchForm").submit();
				}, 900);
			};
			recognition.onerror = function(event) {
				alert("Could not recognize voice. Try again.");
			};
		}
	</script>


		<div class="container-fluid mt-1">
			<div class="row">

				<div class="col-md-2 p-0">

					<div class="card shadow-sm p-0 mb-5 bg-body-tertiary rounded">
						<div class="card-body">
							<div class="list-group">
								<p class="fs-5">Category</p>
								<a href="/products"
									th:classappend="${paramValue==''} ? 'active':''"
									class="list-group-item list-group-item-action"
									aria-current="true"> All </a> <a th:each="c:${categories}"
									th:href="@{'/products?category='+${c.name}}"
									th:classappend="${paramValue == c.name} ? 'active':''"
									class="list-group-item list-group-item-action">[[${c.name}]]</a>
							</div>
						</div>
					</div>
				</div>
				<div class="col-md-10">
					<div class="card">
						<div class="card-body">
							<p class="fs-3 text-center">Products</p>
							<div class="row">

								<th:block th:if="${productsSize >0}">
									<div class="col-md-3 mt-2" th:each="p:${products}">
										<div class="card card-sh">
											<div class="card-body text-center">
												<img alt="" th:src="${p.image}"
													width="150px" height="150px">
												<p class="fs-5 text-center">[[${p.title}]]</p>
												<div class="row text-center">
													<p class="fs-6 fw-bold ">
														<span><th:block th:utext="${@commnServiceImpl.rupeeSign()}"></th:block> [[${p.discountPrice}]]</span> <br> <span
															class="text-decoration-line-through text-secondary"><th:block th:utext="${@commnServiceImpl.rupeeSign()}"></th:block>
															[[${p.price}]]</span> <span class="fs-6 text-success">[[${p.discount}]]%
															off </span>
													</p>
													<a th:href="@{'/product/'+${p.id}}"
														class="btn btn-primary col-md-6 offset-md-3">View
														Details</a>
												</div>
											</div>
										</div>
									</div>
								</th:block>
								<th:block th:unless="${productsSize>0}">
									<p class="fs-4 text-center mt-4 text-danger">Product not
										available</p>
								</th:block>
							</div>

						</div>
					</div>
					<!-- Start Pagination -->
					<div class="row">
						<div class="col-md-4">Total Products : [[${totalElements}]]</div>
						<div class="col-md-6">
							<th:block th:if="${productsSize>0}">
								<nav aria-label="Page navigation example">
									<ul class="pagination">
										<li class="page-item"
											th:classappend="${isFirst} ? 'disabled':''"><a
											class="page-link"
											th:href="@{'/products?pageNo='+${pageNo-1}}"
											aria-label="Previous"> <span aria-hidden="true">&laquo;</span>
										</a></li>

										<li th:each="i:${#numbers.sequence(1,totalPages)}"
											class="page-item"
											th:classappend="${pageNo+1==i}?'active':''">
											<a class="page-link" th:href="@{'/products?pageNo='+${i-1}}">[[${i}]]</a>
										</li>

										<li class="page-item"
											th:classappend="${isLast} ? 'disabled':''"><a
											class="page-link"
											th:href="@{'/products?pageNo='+${pageNo+1}}"
											aria-label="Next"> <span aria-hidden="true">&raquo;</span>
										</a></li>
									</ul>
								</nav>
						</div>
						</th:block>
					</div>

				</div>
			</div>
		</div>

	</section>
</body>
</html>
